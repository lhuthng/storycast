[package]
name = "bm-filmcraft"
version = "0.1.0"
edition = "2021"
# Mirrored from rust/Cargo.toml's workspace floor, on purpose: the plugin is a
# separate build, and it should not silently need a newer compiler than the
# pipeline does.
rust-version = "1.88"
license = "MIT"
description = "Build a Storycast book's acts into a FilmCraft project — an out-of-tree plugin"

# Its own workspace root. This is the decoupling: `cargo build --workspace` and
# `make test` under rust/ must not build, test or lint the plugin, so it cannot
# be a member there and it cannot inherit that workspace's deps either.
[workspace]

[[bin]]
name = "bm-filmcraft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
