[package]
name = "bm-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local TTS server: VieNeu-TTS v3 Turbo on ONNX Runtime, no Python"

rust-version.workspace = true

[[bin]]
name = "bm-tts"
path = "src/main.rs"

# The engine lives in a library so the three dev binaries can share it and so
# the port can be unit-tested without going through the server.
[lib]
name = "bm_tts"
path = "src/lib.rs"

# The gate, and a permanent one: "does this model dir load and run on this box"
# is the first question every worker brings. Declared rather than auto-discovered
# so its name is part of the contract provisioning copies around.
[[bin]]
name = "bm-tts-probe"
path = "src/bin/probe.rs"

# The reference half of the G2P parity check (`tools/g2p-parity.py`). A separate
# binary because the check is run against a corpus, not inside a unit test.
[[bin]]
name = "bm-tts-g2p"
path = "src/bin/g2p.rs"

# The generator half of the frame parity check (`tools/frames-parity.py`).
[[bin]]
name = "bm-tts-frames"
path = "src/bin/frames.rs"

# Runs the audio-reading helpers against jobs from Python, for
# `tools/audio-utils-parity.py`.
[[bin]]
name = "bm-tts-check"
path = "src/bin/check.rs"

# The whole pipeline: text in, wav out. The end-to-end half of
# `tools/render-parity.py`.
[[bin]]
name = "bm-tts-render"
path = "src/bin/render.rs"

[features]
# Pocket TTS is a pure-Rust Candle port, but it is not free: it drags in
# candle-core/-nn/-transformers, hf-hub, rubato and a *second* copy of
# `tokenizers` (the crate pins 0.21, while this workspace already ships 0.23.2
# for VieNeu, and 0.x versions are semver-incompatible so both get compiled).
# A workspace that renders with VieNeu should not pay for any of that, so the
# engine is opt-in and off by default:
#
#     cargo build --features pocket
#
# A ready-to-run binary is what `--features pocket` produces; without it,
# `bm-tts` is VieNeu-only and `bundle.json`/`pocket.safetensors` are not
# recognised at all.
pocket = [
    "dep:pocket-tts",
    "dep:candle-core",
    "dep:tempfile",
    "dep:realfft",
    # `pocket-tts` -> `hf-hub` -> `reqwest` (default features) -> `native-tls`
    # -> `openssl-sys`, and Cargo unifies features additively, so no flag on
    # `reqwest` can turn that off from here. Unvendored, the Linux cross-build
    # (`make tts`, which provisioning runs for every remote box) dies in
    # openssl-sys's build script: there is no Linux OpenSSL to find from a
    # macOS host, and the failure reads as a missing library rather than as the
    # build configuration it is. `vendored` makes openssl-sys compile its own
    # OpenSSL through `cc`, which zigbuild already cross-compiles with, so the
    # cross-build needs nothing staged and nothing installed — and the binary
    # it produces no longer needs libssl on the box at all.
    "dep:openssl-sys",
]

[dependencies]
anyhow = { workspace = true }

# The Pocket TTS runtime. Optional — see the `pocket` feature above.
pocket-tts = { version = "0.6.2", optional = true }
# Only for `Tensor`/`Device`, which `pocket-tts` re-exports in its API surface.
candle-core = { version = "0.9.1", optional = true }
# Staging the config the crate resolves relative to the cwd, in a directory
# that removes itself. Already a dev-dependency; only the `pocket` feature
# needs it at runtime.
tempfile = { workspace = true, optional = true }
# A real-input FFT for the clone-source denoiser. `pocket-tts` already pulls
# realfft in transitively (via rubato), so this costs no new code in the tree.
realfft = { version = "3.5", optional = true }
# A feature lever, not code: `pocket-tts` reaches `openssl-sys` through
# `hf-hub`, and the only way to make it build its own OpenSSL instead of
# looking for one is to enable `vendored` on it. Features are additive across
# the graph, so declaring it here covers the one `openssl-sys` everything
# shares. Nothing in this crate imports it.
openssl-sys = { version = "0.9", optional = true, features = ["vendored"] }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }

# The accent policy and the roster-label parsing live here, because `bm-core` is
# the offline authority for both. The sidecar is the runtime authority, and
# restating its pools in the server would be a third copy of the same list.
bm-core = { workspace = true }
bm-proto = { workspace = true }

# `download-binaries` + `copy-dylibs` (both on by default) fetch ONNX Runtime
# 1.28 and stage its shared library next to the binary, which is exactly what
# provisioning needs to push to a worker: no ONNX Runtime installed there.
ort = "2.0.0-rc.13"

# Vietnamese normalization + G2P. Vendored rather than depended on: it is not
# published to crates.io, and its default features pull PyO3, which cannot link
# into a standalone binary. See vendor/sea-g2p/VENDORED.md for the patch.
# `default-features = false` is load-bearing — the default feature *is* PyO3.
sea-g2p-rs = { path = "../../vendor/sea-g2p", default-features = false }

# The same library `vieneu` uses, loading the same `tokenizer.json`. Pinned to
# the version the wheel resolves so the ids cannot drift under us.
tokenizers = "0.23.2"

[dev-dependencies]
tempfile = { workspace = true }
