[workspace]
resolver = "2"
members = [
    "crates/bm-proto",
    "crates/bm-core",
    "crates/bm-agent",
    "crates/bm-inductor",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Cluster orchestration for the beyond-myriads novel-to-audiobook pipeline"

[workspace.dependencies]
bm-proto = { path = "crates/bm-proto" }
bm-core = { path = "crates/bm-core" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
