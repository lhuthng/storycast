[workspace]
resolver = "2"
members = [
    "crates/bm-proto",
    "crates/bm-core",
    "crates/bm-agent",
    "crates/bm-inductor",
    "crates/bm-tts",
]

# Vendored third-party source, patched (see vendor/sea-g2p/VENDORED.md). It
# declares its own `[workspace]`, which cargo refuses to see inside another
# workspace root unless it is excluded here. Excluded, not a member: it must
# not be built by `cargo build --workspace` with its default features, and its
# upstream test suite needs the 60 MB dictionary that is not in the repo.
exclude = ["vendor/sea-g2p"]

[workspace.package]
version = "0.2.4"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Cluster orchestration for the storycast novel-to-audiobook pipeline"

[workspace.dependencies]
bm-proto = { path = "crates/bm-proto" }
bm-core = { path = "crates/bm-core" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# A crawl reads pages that are not always UTF-8; `charset` lets reqwest honour a
# Content-Type charset, and the crawler's own decode falls back through
# `<meta charset>` when the header says nothing.
encoding_rs = "0.8"
axum = "0.8"
ratatui = "0.29"
# Crawl scripting: the two engines an operator may author a crawler in, plus
# the CSS-selector half of the host ABI. `vendored` builds the Lua interpreter
# from source, so a provisioned worker needs no system Lua of the right
# version — the same argument the TTS sidecar's baked models are built on.
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
rquickjs = "0.14"
scraper = "0.27"
crossterm = "0.28"
chrono = "0.4"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[profile.release]
opt-level = 3
lto = "thin"
