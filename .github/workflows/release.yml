name: release

# Binaries for the Rust tools, one archive per platform. Tags only: a release is
# a tag, and a tag is the thing that names a version.
#
# `bm-tts` is deliberately not in this matrix. It is a release cross-build for
# linux/x86_64 that links a shared ONNX Runtime, so it needs zig and a staged
# runtime, and it is not a program an operator runs on the machine holding the
# dashboard. Provisioning builds it for the box that needs it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The suite runs once, on Linux, instead of per matrix entry. It cannot run on
  # the Windows runner: the provisioning tests spawn `sh` and `rsync`, which is
  # the platform gap this repository does not close, and a red suite there would
  # say nothing about whether the binary is good.
  verify:
    name: test and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: release-verify-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: release-verify-
      - run: cargo test --workspace --locked
        working-directory: rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        working-directory: rust

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      # One target failing must not hide the others: a partial matrix is still
      # worth seeing, and a red cross-platform build is the whole point of it.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
          # macos-13 is the last Intel runner. macos-latest is arm64.
          - runner: macos-13
            target: x86_64-apple-darwin
            ext: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-release-

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p bm-inductor -p bm-agent
        working-directory: rust

      - name: Stage the binaries
        shell: bash
        env:
          # Windows needs the .exe suffix; nothing else does.
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          stage="dist/storycast-$version-${{ matrix.target }}"
          mkdir -p "$stage"
          for bin in bm-inductor bm-agent; do
            cp "target/${{ matrix.target }}/release/$bin$EXE" "$stage/$bin$EXE"
          done
          cp ../README.md "$stage/README.md"
          ls -l "$stage"
        working-directory: rust

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          cd rust/dist
          name=$(ls -d storycast-*)
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$name.zip" "./$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          ls -l

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # A dispatch from a branch has no tag, and `github.ref_name` would be
          # the branch name, so a release would be cut called "main". Fall back
          # to the workspace version, which is what the archives are named for.
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
            tag="v$version"
          fi
          files=$(ls rust/dist/*.tar.gz rust/dist/*.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "$tag" --generate-notes
          fi
