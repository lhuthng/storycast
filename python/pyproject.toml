[project]
name = "storycast-tts"
version = "0.2.0"
description = "TTS sidecar for storycast: VieNeu (local) + Gemini (cloud) voice rendering"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0.0",
  "python-dotenv>=1.0",
  "vieneu==3.6.4",  # pinned: preset roster varies by version
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
